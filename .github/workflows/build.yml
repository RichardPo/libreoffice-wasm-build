name: Build LibreOffice WASM with lokjs

# 1. core      LibreOffice core from an official tag, unmodified, headless WASM. Afterwards the
#              "link kit" (libraries, export list, JS glue, soffice.data) is kept as an artifact.
# 2. lokjs     src/lokjs.c (own main() starting LibreOfficeKit) linked against that kit.
#              With `core_run_id` the kit of an earlier run is reused and `core` is skipped, so a
#              change to lokjs.c takes minutes instead of hours.
# 3. continue  A cold core build may not fit in one 6-hour job: the compiler cache is saved and
#              the workflow starts itself again until the build is done (max `max_attempts`).

on:
  workflow_dispatch:
    inputs:
      lo_ref:
        description: LibreOffice core tag (26.2 or newer; LOK starts the JS UNO bridge since then)
        default: libreoffice-26.8.1.1
      wasm_module:
        description: Office module (writer, calc or impress)
        default: writer
      core_run_id:
        description: Reuse the link kit of this earlier run and skip building LibreOffice
        default: ""
      attempt:
        description: Internal, set when the workflow continues itself
        default: "1"
      max_attempts:
        description: Maximum number of chained runs
        default: "6"

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ inputs.lo_ref }}-${{ inputs.wasm_module }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 4.0.10
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 7G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  # Let emcc run clang through ccache (ccache does not recognise emcc itself).
  EM_COMPILER_WRAPPER: ccache
  EXT_TARBALLS: ${{ github.workspace }}/.tarballs
  KIT_NAME: link-kit-${{ inputs.lo_ref }}-${{ inputs.wasm_module }}

jobs:
  core:
    if: inputs.core_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.result.outputs.complete }}
      timed_out: ${{ steps.make.outputs.timed_out }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Add swap for linking
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ccache flex gettext git gperf libtool \
            nasm pkg-config python3 python3-dev unzip xsltproc libxml2-utils zip zstd

      - uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Check out LibreOffice core ${{ inputs.lo_ref }}
        run: |
          git clone --depth 1 --branch "${{ inputs.lo_ref }}" https://github.com/LibreOffice/core.git core
          git -C core log -1 --format='%H %cd %s'

      - name: Set up Emscripten ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.lo_ref }}-${{ inputs.wasm_module }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.lo_ref }}-${{ inputs.wasm_module }}-
            ccache-

      - name: Restore external sources
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.EXT_TARBALLS }}
          key: tarballs-${{ inputs.lo_ref }}
          restore-keys: tarballs-

      - name: Configure
        working-directory: core
        run: |
          mkdir -p "$EXT_TARBALLS"
          cat > autogen.input <<EOF
          --host=wasm32-local-emscripten
          --disable-gui
          --with-wasm-module=${{ inputs.wasm_module }}
          --with-package-format=emscripten
          --disable-debug
          --disable-crashdump
          --disable-ccache
          --disable-scripting
          --without-java
          --without-doxygen
          --without-help
          --without-junit
          --with-external-tar=$EXT_TARBALLS
          --with-parallelism=$(nproc)
          EOF
          sed -i 's/^ *//' autogen.input
          cat autogen.input
          ./autogen.sh

      - name: Download external sources
        working-directory: core
        run: make fetch

      - name: Save external sources
        # Fixed key: saved once per LibreOffice version, so it does not crowd out the compiler cache.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.EXT_TARBALLS }}
          key: tarballs-${{ inputs.lo_ref }}

      - name: Build LibreOffice
        id: make
        working-directory: core
        # Stops itself well before the 6-hour job limit, so the cache can be saved and a new run
        # can continue. A real build error fails the run instead.
        run: |
          ccache --zero-stats
          set +e
          timeout --kill-after=2m 285m make 2>&1 | tee ../build.log \
            | grep -E --line-buffered '^\[build (LNK|PKG|MOD|ALL)\]|error:|Error '
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Build stopped after the time budget; a new run continues from the cache."
            exit 0
          fi
          tail -n 80 ../build.log
          exit "$rc"

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.lo_ref }}-${{ inputs.wasm_module }}-${{ github.run_id }}

      - name: Result
        id: result
        if: always()
        run: |
          if [ -f core/instdir/program/soffice.data ] && find core/workdir core/instdir -name 'soffice*.linkdeps' | grep -q .; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "LibreOffice not finished in this run."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-attempt-${{ inputs.attempt }}
          path: build.log
          if-no-files-found: ignore

      - name: Collect link kit
        if: steps.result.outputs.complete == 'true'
        run: bash build-repo/scripts/collect-link-kit.sh core "$KIT_NAME.tar.zst"

      - name: Upload link kit
        if: steps.result.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KIT_NAME }}
          path: ${{ env.KIT_NAME }}.tar.zst
          compression-level: 0
          retention-days: 90

  lokjs:
    needs: core
    if: always() && (inputs.core_run_id != '' || needs.core.outputs.complete == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Set up Emscripten ${{ env.EMSDK_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Download link kit
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.KIT_NAME }}
          run-id: ${{ inputs.core_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack link kit
        run: |
          zstd -d -c "$KIT_NAME.tar.zst" | sudo tar -C / -xf -
          sudo chown -R "$USER" core
          du -sh core

      - name: Compile and link lokjs
        run: bash build-repo/scripts/link-lokjs.sh core dist/lokjs

      - name: Check exports
        run: bash build-repo/scripts/check-exports.sh dist/lokjs/lokjs.js

      - name: Package
        run: |
          NAME="lokjs-${{ inputs.wasm_module }}-${{ inputs.lo_ref }}"
          cp build-repo/README.md dist/lokjs/
          git -C build-repo rev-parse HEAD > dist/lokjs/LOKJS_COMMIT
          echo "${{ inputs.lo_ref }}" > dist/lokjs/LIBREOFFICE_REF
          (cd dist && tar -czf "$NAME.tar.gz" lokjs)
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          ls -la dist dist/lokjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/lokjs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${NAME}-run${{ github.run_id }}"
          gh release create "$TAG" "dist/$NAME.tar.gz" --repo "${{ github.repository }}" \
            --title "$NAME" \
            --notes "lokjs (LibreOfficeKit + Embind UNO for JavaScript), linked against unmodified LibreOffice \`${{ inputs.lo_ref }}\` (${{ inputs.wasm_module }}), Emscripten $EMSDK_VERSION. Contents: lokjs.js, lokjs.wasm, soffice.data, soffice.data.js.metadata."

  continue:
    needs: core
    if: always() && needs.core.outputs.timed_out == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(( ${{ inputs.attempt }} + 1 ))
          if [ "$NEXT" -gt "${{ inputs.max_attempts }}" ]; then
            echo "::error::Build did not finish within ${{ inputs.max_attempts }} runs."
            exit 1
          fi
          # A workflow_dispatch from GITHUB_TOKEN is allowed to start a new run.
          gh workflow run build.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f lo_ref="${{ inputs.lo_ref }}" -f wasm_module="${{ inputs.wasm_module }}" \
            -f attempt="$NEXT" -f max_attempts="${{ inputs.max_attempts }}"
          echo "Started attempt $NEXT"
